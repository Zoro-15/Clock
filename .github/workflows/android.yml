name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Clock-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Determine Incremental Version
        id: version
        if: github.event_name != 'pull_request'
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName = ['\"]\(.*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="2.34"
          fi
          TAG_NAME="v${VERSION_NAME}.${{ github.run_number }}"
          RELEASE_TITLE="Clock v${VERSION_NAME} (Build #${{ github.run_number }})"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          TITLE="${{ steps.version.outputs.release_title }}"
          echo "Releasing $TAG: $TITLE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets..."
            gh release upload "$TAG" app/build/outputs/apk/debug/*.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
              --title "$TITLE" \
              --generate-notes
          fi
